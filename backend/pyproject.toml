[project]
name = "project11-backend"
version = "0.1.0"
description = "Project11 AI 小说创作平台后端 — 三阶段 LLM 流水线 + BYOK + RAG"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "python-multipart==0.0.32",
    # LLM orchestration
    "langgraph==1.2.11",
    "litellm==1.90.7",
    # Database
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pgvector==0.5.0",
    # Cache / queue
    "redis==8.1.0",
    # Config
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # HTTP client (used by litellm + tests)
    "httpx==0.28.1",
    # HTML sanitization (nh3) for content_html
    "nh3==0.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "bandit==1.9.4",
]

[tool.uv]
package = false
