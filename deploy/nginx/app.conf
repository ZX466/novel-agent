# =============================================================================
# Project11 — Nginx reverse proxy config (Tencent Cloud server)
# Mounts to /etc/nginx/conf.d/default.conf in the nginx container.
#
# TLS is MANDATORY (R8-6): port 80 only issues a 301 → https. Place your
# certificate chain + key at deploy/nginx/certs/fullchain.pem / privkey.pem
# (mounted to /etc/nginx/certs). See deploy/README.md "HTTPS" section.
# =============================================================================

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:7421;
}

# ---------------------------------------------------------------------------
# Port 80: force HTTPS. Never serve the app over plaintext HTTP (API keys in
# X-API-Key / X-Provider-Config are sent as-is and must travel over TLS).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Port 443: TLS termination + reverse proxy.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Explicit: HSTS only over the HTTPS listener, where it is meaningful.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # NOTE: Content-Security-Policy is intentionally NOT set here — Next.js
    # App Router embeds inline RSC bootstrap scripts, so a blanket CSP breaks
    # the app. A correct CSP needs a nonce-based strategy via Next.js
    # middleware; tracked as follow-up (R8 backlog).

    # Default: route everything to Next.js frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API endpoints (documents, chat, health)
    location /v1/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Disable buffering for SSE endpoints (/v1/chat)
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}