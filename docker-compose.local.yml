# =============================================================================
# LOCAL-ONLY: PostgreSQL (pgvector) + Redis for local development
# =============================================================================
# 用途：腾讯云服务器到期后，本机轻量跑 PG + Redis 两个容器。
# 前后端仍用本地进程（uvicorn + next dev），不在此 compose 内。
#
# 安全（按 Codex 安全审查落地）：
#   1. 端口仅绑定 127.0.0.1，禁止局域网暴露。
#   2. 密码必须来自仓库根目录 .env（不入库），无默认弱密码；
#      缺失时 compose 启动直接失败（:? 强制）。
#   3. Redis 开启 --protected-mode yes。
#   4. 容器设 CPU/内存上限。
#
# 首次使用：
#   Copy-Item .env.example .env    # 在仓库根目录创建，填入强密码
#   docker compose -f docker-compose.local.yml up -d
# 停止： docker compose -f docker-compose.local.yml down
# 数据： pg_data / redis_data 卷持久化在本地，删除容器不丢数据。
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project11-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # SECURITY: REQUIRED — no default. Set a >=20 char random value in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env (>=20 chars)}
      POSTGRES_DB: ${POSTGRES_DB:-project11}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-project11}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: project11-redis-local
    restart: unless-stopped
    # SECURITY: protected-mode yes + requirepass from .env (no default).
    command: ["redis-server", "--port", "16379", "--protected-mode", "yes", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required in .env (>=20 chars)}"]
    ports:
      - "127.0.0.1:16379:16379"
    volumes:
      - redis_data:/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
