name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync --locked

      - name: Security scan (bandit; Medium+ 阻断)
        run: uv run bandit -r app -q -lll

      - name: Run tests
        run: uv run pytest tests/ -q
