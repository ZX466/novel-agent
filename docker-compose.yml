# =============================================================================
# FOR TENCENT CLOUD SERVER ONLY — DO NOT RUN LOCALLY
# =============================================================================
# The user's local Windows machine must NOT have Docker installed.
# Local development uses direct process runs:
#   - Backend:  cd backend && uvicorn app.main:app --reload
#   - Frontend: cd frontend && npm run dev
#   - PG/Redis: use remote or hosted instances
#
# This file is invoked ONLY on the Tencent Cloud server:
#   docker compose up -d --build
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: novel-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # SECURITY: Override POSTGRES_PASSWORD in .env — the default is for dev only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # NAMING: POSTGRES_DB 默认值保留 project11——数据库名与既有卷内数据绑定，改名会导致旧数据不可见（全局改名任务明确不改）
      POSTGRES_DB: ${POSTGRES_DB:-project11}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-project11}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: novel-agent-redis
    restart: unless-stopped
    # NAMING: REDIS_PASSWORD 默认值保留（project11-redis）——它是 redis 与 backend 间的共享认证凭据，属行为面不改名
    command: ["redis-server", "--port", "16379", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-project11-redis}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "-a", "${REDIS_PASSWORD:-project11-redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-agent-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override container-internal hosts for sibling services
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-project11}
      REDIS_URL: redis://:${REDIS_PASSWORD:-project11-redis}@redis:16379/0
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:80","https://localhost:8443","https://${PUBLIC_DOMAIN:-}"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel-agent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "7421"

  nginx:
    image: nginx:alpine
    container_name: novel-agent-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  redis_data:
